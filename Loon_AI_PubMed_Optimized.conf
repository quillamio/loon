[Script]
# ============================================================
# AI 节点实测工具（远程 GitHub 脚本，无需添加本地脚本）
# ============================================================

# 手动全量检测：逐个实际访问 OpenAI API + ChatGPT，并自动选择综合最稳节点。
generic then script("https://raw.githubusercontent.com/quillamio/loon/main/scripts/ai-node-check.js", "full") with tag="AI节点全量检测", img_url="wand.and.stars.system", timeout=600

# 每 6 小时守护：只检测当前节点；当前正常绝不切换，失效后才全量扫描。
cron "17 */6 * * *" then script("https://raw.githubusercontent.com/quillamio/loon/main/scripts/ai-node-check.js", "guard") with tag="AI节点稳定守护", timeout=600

# Wi-Fi / 网络变化后检查当前 AI 节点。
network-changed then script("https://raw.githubusercontent.com/quillamio/loon/main/scripts/ai-node-check.js", "guard") with tag="AI网络变化检测", timeout=600
