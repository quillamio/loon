[Script]
# AI 节点实测工具（远程 GitHub 脚本，无需本地脚本）
# 手动全量检测
generic script-path=https://raw.githubusercontent.com/quillamio/loon/main/scripts/ai-node-check.js,tag=AI节点全量检测,img-url=wand.and.stars.system,timeout=600,argument="full",enable=true

# 每 6 小时守护：当前节点正常则不切换；失效后才重新选
cron "17 */6 * * *" script-path=https://raw.githubusercontent.com/quillamio/loon/main/scripts/ai-node-check.js,tag=AI节点稳定守护,timeout=600,argument="guard",enable=true

# 网络变化后检测当前 AI 节点
network-changed script-path=https://raw.githubusercontent.com/quillamio/loon/main/scripts/ai-node-check.js,tag=AI网络变化检测,timeout=600,argument="guard",enable=true
