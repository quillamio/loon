[Proxy]

[Remote Filter]
# 1. 下载专用高级节点
下载专用节点 = NameRegex, FilterKey = "^(?=.*高速)(?!.*((?i)回国|校园|游戏|测试|0\.1|0\.5|免费|限速|永久|网址)).*$"

# 2. 日韩新节点
日韩新节点 = NameRegex, FilterKey = "^(?=.*((?i)🇯🇵|🇰🇷|🇸🇬|日本|韩国|新加坡|川日|东京|大阪|泉日|埼玉|首尔|狮|(\b(JP|JPN|Japan|KR|KOR|Korea|SG|SGP|Singapore)(\d+)?\b)))(?!.*((?i)回国|校园|游戏|测试|网址|永久|官网|🎮|(\b(GAME)\b))).*$"

# 3. 亚洲节点
亚洲节点 = NameRegex, FilterKey = "^(?=.*((?i)🇭🇰|🇹🇼|🇮🇳|🇻🇳|香港|台湾|印度|越南|孟买|(\b(HK|HKG|Hongkong|Hong Kong|TW|TWN|Tai|Taiwan|IN|IND|India|VN)(\d+)?\b)))(?!.*((?i)回国|校园|游戏|测试|网址|永久|官网|🎮|(\b(GAME)\b))).*$"

# 4. 欧洲节点
欧洲节点 = NameRegex, FilterKey = "^(?=.*((?i)🇬🇧|🇩🇪|🇫🇷|🇷🇺|🇺🇦|英国|德国|法国|俄罗斯|乌克兰|伦敦|法兰克福|(\b(UK|GB|London|DE|GER|Germany|FR|RU|UA)(\d+)?\b)))(?!.*((?i)回国|校园|游戏|测试|网址|永久|官网|🎮|(\b(GAME)\b))).*$"

# 5. 美加澳节点
美加澳节点 = NameRegex, FilterKey = "^(?=.*((?i)🇺🇸|🇨🇦|🇦🇺|美国|加拿大|澳洲|澳大利亚|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|蒙特利尔|多伦多|温哥华|悉尼|(\b(US|USA|United States|CA|CAN|Canada|AU|AUS|Australia)(\d+)?\b)))(?!.*((?i)回国|校园|游戏|测试|网址|永久|官网|🎮|(\b(GAME)\b))).*$"

游戏节点 = NameRegex, FilterKey = "^(?=.*((?i)游戏|🎮|(\b(GAME)(\d+)?\b)))(?!.*((?i)回国|校园|测试|网址|永久|官网)).*$"

全球节点 = NameRegex, FilterKey = "^(?=.*(.))(?!.*((?i)群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|超时|收藏|福利|测试|永久|好友|失联|(\b(USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author|Traffic)(\d+)?\b|(\d{4}-\d{2}-\d{2}|\dG)))).*$"

# AI候选池仍沿用你原本的规则，不在 Safe 版里冒险改节点来源
AI解锁节点 = NameRegex, FilterKey = "^(?=.*((?i)Gemini|GPT|ChatGPT|高速|专线))(?!.*((?i)回国|校园|游戏|测试|0\.1|0\.5|免费|限速|永久|网址|香港|🇭🇰|台湾|🇹🇼|HK|HKG|TW|TWN|Hong Kong|Taiwan)).*$"

