[Script]
# ============================================================
# 安全健康检测：不枚举节点、不自动切换、不改策略。
# 手动运行时显示当前 AI 节点的 OpenAI 延迟/抖动等级。
# ============================================================
generic script-path=https://raw.githubusercontent.com/quillamio/loon/main/scripts/ai-health-check.js,tag=AI链路健康检测,timeout=60,enable=true

# 每 30 分钟静默检查；只有 C/D 级异常才通知，不做任何切换
cron "*/30 * * * *" script-path=https://raw.githubusercontent.com/quillamio/loon/main/scripts/ai-health-check.js,tag=AI链路稳定守护,timeout=60,argument="silent",enable=true

# Wi-Fi/网络变化后检查一次；仍然只提醒，不切换节点
network-changed script-path=https://raw.githubusercontent.com/quillamio/loon/main/scripts/ai-health-check.js,tag=AI网络变化检测,timeout=60,argument="silent",enable=true
